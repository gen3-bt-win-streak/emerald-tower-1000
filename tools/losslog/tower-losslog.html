<title>タワー敗戦ログ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: sticky bar (title + export) on top; one column of cards: 試合 → 敵 → ターン（カード列）→ 結末 → 書き出し. Phone first, 1 column everywhere. */
:root{
  --bg:#eff0f5; --surface:#ffffff; --ink:#1b1f2e; --muted:#5e6478; --line:#d4d7e2;
  --accent:#3b4ea8; --accent-ink:#ffffff; --accent-soft:#dde2f6;
  --warn:#9a5c00; --warn-soft:#fbecd2; --bad:#b0281f; --bad-soft:#f8dcd9; --good:#0d7656; --good-soft:#d9eee5;
  --font-display:"DotGothic16","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --font-mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141c; --surface:#1b1e29; --ink:#e4e6ee; --muted:#9aa0b5; --line:#2e3242;
  --accent:#8c9cf0; --accent-ink:#0f1330; --accent-soft:#262c4a;
  --warn:#f0b357; --warn-soft:#3a2b10; --bad:#f2857c; --bad-soft:#3d1a17; --good:#45c596; --good-soft:#163a2c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141c; --surface:#1b1e29; --ink:#e4e6ee; --muted:#9aa0b5; --line:#2e3242;
  --accent:#8c9cf0; --accent-ink:#0f1330; --accent-soft:#262c4a;
  --warn:#f0b357; --warn-soft:#3a2b10; --bad:#f2857c; --bad-soft:#3d1a17; --good:#45c596; --good-soft:#163a2c; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;display:flex;flex-direction:column;gap:14px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:14px}
.bar-in{max-width:900px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:1.3rem;margin:0;letter-spacing:.04em;flex:1 1 auto;white-space:nowrap}
h2{font-family:var(--font-display);font-weight:400;font-size:1.05rem;margin:0;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:700}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
.btn.undo{background:var(--bad);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .sub{color:var(--muted);font-size:.8rem;margin-left:auto;text-align:right}
.row{display:flex;flex-wrap:wrap;gap:10px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
textarea{resize:vertical;min-height:4.5em;line-height:1.45}
.fld.w-s input,.fld.w-s select{width:7.5em}
.fld.w-m input,.fld.w-m select{width:11em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--bg);border:0;padding:7px 12px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"].bad{background:var(--bad);color:#fff}
/* enemy slots */
.slots{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.slots{grid-template-columns:1fr 1fr}}
.slot{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--bg)}
.slot-h{display:flex;align-items:center;gap:8px}
.slot-no{font-family:var(--font-display);font-size:1rem}
.slot-no.bench{color:var(--muted)}
.slot .pill{margin-left:auto;font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.slot .pill.one{background:var(--accent);color:var(--accent-ink)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg:empty{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.tag[aria-pressed="true"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.chip.tag.ok[aria-pressed="true"]{background:var(--good);color:#fff;border-color:var(--good)}
.setinfo{font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.setinfo b{color:var(--ink);font-weight:700}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:0 6px;line-height:1}
/* turns */
.turn{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.turn-h{display:flex;align-items:center;gap:8px}
.turn-no{font-family:var(--font-display);font-size:1.05rem;min-width:2.4em}
.turn-h .x{margin-left:auto}
.act{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 8px;align-items:center;padding:6px 8px;border-radius:8px;background:var(--bg)}
.act.en{background:var(--bad-soft)}
.act .side{font-size:.74rem;color:var(--muted);letter-spacing:.06em;writing-mode:horizontal-tb;white-space:nowrap}
.act .main{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.act select,.act input[type=text]{padding:5px 8px;font-size:16px}
.act select.who{max-width:11em}
.act select.mv,.act input.mv{flex:1 1 9em;min-width:0}
.act select.tgt{max-width:8.5em}
.act .arrow{color:var(--muted)}
.tags{grid-column:2;display:flex;flex-wrap:wrap;gap:5px}
.tags .chip{padding:2px 9px;font-size:.78rem}
.tags input{width:6.5em;padding:3px 8px;font-size:16px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.add{background:none;border:1px dashed var(--line);border-radius:8px;padding:7px 12px;font-size:.88rem;color:var(--muted)}
.note{font-size:.82rem;color:var(--muted)}
/* export */
.out textarea{font-family:var(--font-mono);font-size:12px;min-height:12em;width:100%;box-sizing:border-box;white-space:pre;overflow-x:auto}
.toast{font-size:.84rem;color:var(--good);min-height:1.2em}
.hint{font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .12s,color .12s}}
</style>

<header class="bar"><div class="bar-in">
  <h1>タワー敗戦ログ</h1>
  <button class="btn" id="btnExport" type="button">書き出し</button>
  <button class="btn ghost" id="btnNew" type="button">新しい試合</button>
</div></header>

<main class="wrap">
  <section class="card" id="secMeta">
    <div class="card-h"><h2>試合</h2><span class="sub">入力はこの端末にだけ保存されます</span></div>
    <div class="row">
      <label class="fld w-m">日付<input type="date" id="fDate"></label>
      <label class="fld w-s">連勝（停止時）<input type="number" id="fStreak" inputmode="numeric" placeholder="105"></label>
      <label class="fld w-s">構築<input type="text" id="fBuild"></label>
      <label class="fld">結果<span class="seg" id="fResult"><button type="button" class="bad" data-v="負け" aria-pressed="true">負け</button><button type="button" data-v="勝ち" aria-pressed="false">勝ち（記録用）</button></span></label>
    </div>
    <div class="row">
      <label class="fld w-m">自分の先発①<select id="fLead0"></select></label>
      <label class="fld w-m">自分の先発②<select id="fLead1"></select></label>
      <label class="fld w-m">トレーナー（任意）<input type="text" id="fTrainer" placeholder="例：バグマニア"></label>
    </div>
  </section>

  <section class="card" id="secEnemy">
    <div class="card-h"><h2>敵</h2><span class="sub">種族を入れると型番号を選べます（分かる範囲で）</span></div>
    <div class="slots" id="slots"></div>
  </section>

  <section class="card" id="secTurns">
    <div class="card-h"><h2>ターン</h2><span class="sub">タグは対象に起きたこと。いない駒は「（いない）」</span></div>
    <div id="turns" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="addrow"><button class="add" id="btnAddTurn" type="button">＋ ターンを追加</button></div>
  </section>

  <section class="card" id="secEnd">
    <div class="card-h"><h2>結末</h2></div>
    <div class="row">
      <label class="fld" style="flex:1 1 14em">最後に残っていた駒（自分／敵）<input type="text" id="fLeft" placeholder="例：カビゴン残り1/3 ／ 敵 ラグラージ満タン"></label>
    </div>
    <label class="fld">所感・分岐点だと思った場面<textarea id="fNote" placeholder="例：T3のみがわりが分岐点。相方のラグラージを先に見ておくべきだった"></textarea></label>
  </section>

  <section class="card out" id="secOut">
    <div class="card-h"><h2>書き出し</h2><span class="sub">コピーしてチャットに貼る</span></div>
    <div class="row"><button class="btn" id="btnCopy" type="button">コピー</button><span class="toast" id="toast"></span></div>
    <textarea id="fOut" readonly spellcheck="false"></textarea>
    <div class="hint">本文は人が読む用、末尾の json ブロックは解析用。両方そのまま貼ってください。</div>
  </section>
</main>

      }
      if (a.act === '交代') {
        const to = el('select', { class: 'tgt', onchange: ev => { a.tgt = ev.target.value; save(); } });
        to.append(opt('', '→誰に', !a.tgt));
        if (a.side === 'me') for (const m of TEAM.members) { if (m.name !== a.who) to.append(opt(m.name, '→' + m.name, m.name === a.tgt)); }
        else for (let i = 0; i < 4; i++) { if (SLOT_NAMES[i] !== a.who) to.append(opt(SLOT_NAMES[i], '→' + enemyLabel(i), SLOT_NAMES[i] === a.tgt)); }
        main.append(to);
      } else if (!noTarget(a.act)) {
        main.append(el('span', { class: 'arrow' }, '→'));
        const tg = el('select', { class: 'tgt', onchange: ev => { a.tgt = ev.target.value; save(); } });
        tg.append(opt('', '対象', !a.tgt));
        for (const [v, l] of targetsFor(a.side)) tg.append(opt(v, l, v === a.tgt));
        main.append(tg);
      }
      row.append(main);
      if (!noTarget(a.act)) {
        const tags = el('div', { class: 'tags' });
        for (const tg of (a.side === 'me' ? TAGS_ME : TAGS_EN)) {
          // 押すたびに現在の状態を見て付け外しする（描画時の状態を使うと外せない）
          tags.append(el('button', { class: 'chip tag' + (tg === '倒れた' ? ' ok' : ''), type: 'button', 'aria-pressed': String(a.tags.includes(tg)), onclick: ev => { const on = a.tags.includes(tg); a.tags = on ? a.tags.filter(x => x !== tg) : a.tags.concat(tg); save(); ev.currentTarget.setAttribute('aria-pressed', String(!on)); } }, tg));
        }
        const hp = el('input', { type: 'text', placeholder: '残りHP', value: a.hp || '', 'aria-label': '対象の残りHP' }); hp.addEventListener('input', ev => { a.hp = ev.target.value; save(); });
        tags.append(hp);
        row.append(tags);
      }
      card.append(row);
    });
    const note = el('input', { type: 'text', placeholder: 'このターンのメモ（任意）', value: t.note || '' }); note.addEventListener('input', ev => { t.note = ev.target.value; save(); });
    card.append(note);
    root.append(card);
  });
}
$('btnAddTurn').addEventListener('click', () => { S.turns.push(blankTurn(S.turns[S.turns.length - 1])); save(); renderTurns(); $('turns').lastElementChild.scrollIntoView({ block: 'nearest' }); });

/* ---------- export ---------- */
function actText(a) {
  if (!a.who || !a.act) return '';
  const who = a.side === 'me' ? a.who : enemyLabel(SLOT_NAMES.indexOf(a.who));
  let act = a.act === 'その他' ? (a.free || 'その他') : a.act;
  let s = who + ' ' + act;
  if (a.act === '交代') s += '→' + (a.side === 'me' ? a.tgt : enemyLabel(SLOT_NAMES.indexOf(a.tgt)));
  else if (a.tgt) s += '→' + (SLOT_NAMES.includes(a.tgt) ? enemyLabel(SLOT_NAMES.indexOf(a.tgt)) : a.tgt);
  const extra = a.tags.slice(); if (a.hp) extra.push('残り' + a.hp);
  if (extra.length) s += '（' + extra.join('・') + '）';
  return s;
}
function exportText() {
  const L = [];
  const title = '# ' + (S.result === '負け' ? '敗戦' : '試合') + 'ログ ' + S.date + '｜' + S.build + (S.streak ? '｜' + S.streak + '連勝' + (S.result === '負け' ? 'で停止' : '') : '');
  L.push(title);
  L.push('- 日付: ' + S.date + ' / 構築: ' + S.build + ' / 連勝: ' + (S.streak || '?') + ' / 結果: ' + S.result + (S.trainer ? ' / トレーナー: ' + S.trainer : ''));
  L.push('- 自分の先発: ' + S.lead.join('／'));
  L.push('- 敵: ' + S.enemies.map((e, i) => SLOT_NAMES[i] + ' ' + (e.sp ? enemyLabel(i, true) : '?')).join(', '));
  L.push('', '| T | 自分 | 敵 | メモ |', '|---|---|---|---|');
  S.turns.forEach((t, i) => {
    const me = t.acts.filter(a => a.side === 'me').map(actText).filter(Boolean).join('／');
    const en = t.acts.filter(a => a.side === 'en').map(actText).filter(Boolean).join('／');
    L.push('| ' + (i + 1) + ' | ' + me + ' | ' + en + ' | ' + (t.note || '') + ' |');
  });
  L.push('', '- 残り: ' + (S.left || '—'), '- 所感: ' + (S.note || '—'));
  const data = { v: 1, date: S.date, streak: S.streak, build: S.build, result: S.result, trainer: S.trainer, lead: S.lead,
    enemies: S.enemies.map((e, i) => ({ slot: SLOT_NAMES[i], species: e.sp || null, set: e.id })),
    turns: S.turns.map(t => ({ acts: t.acts.filter(a => a.who && a.act).map(a => ({ side: a.side, who: a.who, act: a.act === 'その他' ? (a.free || 'その他') : a.act, target: a.tgt || null, tags: a.tags, hp: a.hp || null })), note: t.note || null })),
    left: S.left, note: S.note };
  L.push('', '```json', JSON.stringify(data), '```');
  return L.join('\n');
}
function showExport() { $('fOut').value = exportText(); $('secOut').scrollIntoView({ block: 'start' }); }
$('btnExport').addEventListener('click', showExport);
$('btnCopy').addEventListener('click', () => {
  const txt = exportText(); $('fOut').value = txt; const t = $('toast');
  const fallback = () => { $('fOut').focus(); $('fOut').select(); t.textContent = '選択しました。長押しでコピーしてください'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => { t.textContent = 'コピーしました'; setTimeout(() => { t.textContent = ''; }, 2500); }, fallback);
  else fallback();
});

/* ---------- new game (with undo) ---------- */
let undo = null, undoTimer = null;
$('btnNew').addEventListener('click', () => {
  const b = $('btnNew');
  if (undo) { S = undo; undo = null; clearTimeout(undoTimer); b.textContent = '新しい試合'; b.classList.remove('undo'); save(); renderAll(); return; }
  undo = S; S = blank(); save(); renderAll();
  b.textContent = '取り消す'; b.classList.add('undo');
  undoTimer = setTimeout(() => { undo = null; b.textContent = '新しい試合'; b.classList.remove('undo'); }, 4000);
});

function renderAll() { renderMeta(); renderSlots(); renderTurns(); $('fOut').value = ''; }
renderAll();
})();
</script>
